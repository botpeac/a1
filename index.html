<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ရွှေတွက်စက်</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #fcc103 0%, #d4a017 100%);
            --bg-dark: #0f1115;
            --card-bg: #1c1f26;
            --input-bg: #262a33;
            --text-main: #ffffff;
            --text-dim: #a0a6b1;
            --accent-gold: #fcc103;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Pyidaungsu', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            padding-left: calc(15px + env(safe-area-inset-left));
            padding-right: calc(15px + env(safe-area-inset-right));
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }

        h2 { 
            color: var(--accent-gold); 
            font-size: 1rem; 
            margin: 20px 0 12px 0; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        h2::before {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--gold-gradient);
            border-radius: 10px;
        }

        .unit-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .unit-field { position: relative; }
        
        .unit-label {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: var(--text-dim);
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 16px 12px;
            background: var(--input-bg);
            border: 1.5px solid transparent;
            color: white;
            border-radius: 14px;
            font-size: 1rem;
            appearance: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--accent-gold);
            outline: none;
            background: #2d323d;
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            color: #111;
            transition: var(--transition);
        }

        .btn-reset {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #444;
            color: var(--text-dim);
            border-radius: 14px;
            margin-top: 12px;
            cursor: pointer;
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            border: none;
            color: white;
            border-radius: 14px;
            margin-top: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #resultSection { display: none; }
        
        #captureArea {
            padding: 15px;
            background: var(--card-bg);
            border-radius: 20px;
        }

        .result-card {
            background: rgba(255,255,255,0.03);
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .total-box {
            background: var(--gold-gradient);
            color: #000;
            padding: 20px;
            text-align: center;
            border-radius: 20px;
            margin: 20px 0;
        }

        .total-box .val-lg {
            font-size: 1.8rem;
            font-weight: 800;
            display: block;
        }

        .label-sm { font-size: 0.9rem; color: var(--text-dim); }

        /* Hidden by default, visible in saved photo */
        #photoTimestamp {
            display: none;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }



        /* World gold price banner */
        .gold-banner {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .gold-banner__left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .gold-banner__title {
            font-size: 0.85rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gold-banner__value {
            font-size: 1rem;
            font-weight: 750;
            color: var(--accent-gold);
            line-height: 1.1;
            white-space: nowrap;
        }

        .gold-banner__meta {
            font-size: 0.72rem;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .gold-banner__right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .gold-refresh {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.15);
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            display: grid;
            place-items: center;
            padding: 0;
        }


        .gold-refresh.loading {
            animation: spin 1s linear infinite;
            opacity: 0.9;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .gold-refresh:active {
            transform: scale(0.97);
        }

        /* When banner is cloned into capture area */
        .gold-banner--capture {
            position: static;
            margin-bottom: 12px;
        }

        @media (max-height: 600px) {
            body { align-items: flex-start; }
            .container { margin-top: 10px; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="gold-banner" id="goldBanner" role="status" aria-live="polite">
        <div class="gold-banner__left">
            <div class="gold-banner__title">🌍 ကမ္ဘာ့ရွှေဈေး (XAU/USD)</div>
            <div class="gold-banner__meta" id="worldGoldUpdated">Updating…</div>
        </div>
        <div class="gold-banner__right">
            <div class="gold-banner__value" id="worldGoldPrice">Loading…</div>
            <button class="gold-refresh" id="goldRefreshBtn" type="button" aria-label="Refresh world gold price" title="Refresh">⟳</button>
        </div>
    </div>

    <div id="inputSection">
        <h2 style="margin-top: 0;">ရွှေဈေး (ပေါက်ဈေး)</h2>
        <div class="input-group">
            <div class="unit-field">
                <input type="number" id="marketPrice" pattern="\d*" inputmode="decimal" placeholder="၀">
                <span class="unit-label">ကျပ်</span>
            </div>
        </div>

        <h2>ရွှေအလေးချိန်</h2>
        <div class="unit-row">
            <div class="unit-field"><input type="number" id="wk" inputmode="decimal" placeholder="၀" oninput="autoConvert('wk','wp','wy')"><span class="unit-label">ကျပ်</span></div>
            <div class="unit-field"><input type="number" id="wp" inputmode="decimal" placeholder="၀" oninput="autoConvert('wk','wp','wy')"><span class="unit-label">ပဲ</span></div>
            <div class="unit-field"><input type="number" id="wy" inputmode="decimal" placeholder="၀" oninput="autoConvert('wk','wp','wy')"><span class="unit-label">ရွေး</span></div>
        </div>

        <h2>အလျော့တွက်</h2>
        <div class="unit-row">
            <div class="unit-field"><input type="number" id="rk" inputmode="decimal" placeholder="၀" oninput="autoConvert('rk','rp','ry')"><span class="unit-label">ကျပ်</span></div>
            <div class="unit-field"><input type="number" id="rp" inputmode="decimal" placeholder="၀" oninput="autoConvert('rk','rp','ry')"><span class="unit-label">ပဲ</span></div>
            <div class="unit-field"><input type="number" id="ry" inputmode="decimal" placeholder="၀" oninput="autoConvert('rk','rp','ry')"><span class="unit-label">ရွေး</span></div>
        </div>

        <h2>အခြားစရိတ်</h2>
        <div class="unit-row">
            <div class="unit-field" style="grid-column: span 1.5;">
                <input type="number" id="smithFee" inputmode="decimal" placeholder="လက်ခ">
            </div>
            <div class="unit-field" style="grid-column: span 1.5;">
                <input type="number" id="stonePrice" inputmode="decimal" placeholder="ကျောက်ဖိုး">
            </div>
        </div>

        <button class="btn-primary" onclick="showResults()">တွက်ချက်မည်</button>
        <button class="btn-reset" onclick="clearInputs()">အချက်အလက်ဖျက်ရန်</button>
    </div>

    <div id="resultSection">
        <div id="captureArea">
            <h2 style="margin-top: 0;">ရှင်းတမ်း</h2>
            
            <div class="result-card" style="border-left: 4px solid var(--accent-gold);">
                <div class="result-row">
                    <span class="label-sm">ပေါက်ဈေး</span>
                    <span class="val-lg" id="resMP" style="font-weight: 700; color: var(--accent-gold);"></span>
                </div>
            </div>

            <div class="result-card">
                <div class="result-row">
                    <span class="label-sm">အလေးချိန်</span>
                    <span id="resW"></span>
                </div>
                <div class="result-row" style="margin-top: 8px; border-top: 1px solid #333; padding-top: 8px;">
                    <span class="label-sm">ရွှေဖိုး</span>
                    <span class="val-lg" id="resWV"></span>
                </div>
            </div>

            <div class="result-card">
                <div class="result-row">
                    <span class="label-sm">အလျော့တွက်</span>
                    <span id="resR"></span>
                </div>
                <div class="result-row" style="margin-top: 8px; border-top: 1px solid #333; padding-top: 8px;">
                    <span class="label-sm">တန်ဖိုး</span>
                    <span class="val-lg" id="resRV"></span>
                </div>
            </div>

            <div class="result-card">
                <div class="result-row">
                    <span class="label-sm">လက်ခ/ကျောက်</span>
                    <span id="resFees"></span>
                </div>
            </div>

            <div class="total-box">
                <span style="font-size: 0.8rem; opacity: 0.8; font-weight: 600;">စုစုပေါင်းကျသင့်ငွေ</span>
                <span class="val-lg" id="resTotal"></span>
            </div>
            
            <div id="photoTimestamp"></div>
        </div>

        <button class="btn-save" onclick="captureResult()">
            📸 ဓာတ်ပုံသိမ်းဆည်းမည်
        </button>

        <button class="btn-reset" onclick="backToInput()" style="background: #333; color: white; border: none;">နောက်သို့</button>
    </div>
</div>

<script>
    const getV = id => parseFloat(document.getElementById(id).value) || 0;

    function autoConvert(kId, pId, yId) {
        let k = getV(kId), p = getV(pId), y = getV(yId);
        if (y >= 8) { p += Math.floor(y / 8); y = y % 8; }
        if (p >= 16) { k += Math.floor(p / 16); p = p % 16; }
        document.getElementById(kId).value = k || '';
        document.getElementById(pId).value = p || '';
        document.getElementById(yId).value = y || '';
    }

    function clearInputs() {
        ['marketPrice', 'wk', 'wp', 'wy', 'rk', 'rp', 'ry', 'smithFee', 'stonePrice'].forEach(id => {
            document.getElementById(id).value = '';
        });
    }

    function showResults() {
        const price = getV('marketPrice');
        const weight = getV('wk') + (getV('wp') / 16) + (getV('wy') / 128);
        const reduction = getV('rk') + (getV('rp') / 16) + (getV('ry') / 128);
        const fees = getV('smithFee') + getV('stonePrice');

        const goldVal = weight * price;
        const redVal = reduction * price;
        const total = goldVal + redVal + fees;

        document.getElementById('resMP').innerText = `${price.toLocaleString()} ကျပ်`;
        document.getElementById('resW').innerText = `${getV('wk')} ကျပ် ${getV('wp')} ပဲ ${getV('wy')} ရွေး`;
        document.getElementById('resWV').innerText = `${Math.round(goldVal).toLocaleString()} ကျပ်`;
        document.getElementById('resR').innerText = `${getV('rk')} ကျပ် ${getV('rp')} ပဲ ${getV('ry')} ရွေး`;
        document.getElementById('resRV').innerText = `${Math.round(redVal).toLocaleString()} ကျပ်`;
        document.getElementById('resFees').innerText = `${fees.toLocaleString()} ကျပ်`;
        document.getElementById('resTotal').innerText = `${Math.round(total).toLocaleString()} ကျပ်`;

        document.getElementById('inputSection').style.display = 'none';
        document.getElementById('resultSection').style.display = 'block';
        window.scrollTo(0,0);
    }

    function backToInput() {
        document.getElementById('inputSection').style.display = 'block';
        document.getElementById('resultSection').style.display = 'none';
    }

    function captureResult() {
        const captureArea = document.getElementById('captureArea');
        const stamp = document.getElementById('photoTimestamp');

        // Clone the top banner into capture area so it appears in the saved photo
        const banner = document.getElementById('goldBanner');
        let bannerClone = null;
        if (banner && captureArea) {
            bannerClone = banner.cloneNode(true);
            bannerClone.id = "goldBannerCapture";
            bannerClone.classList.add("gold-banner--capture");
            captureArea.insertBefore(bannerClone, captureArea.firstChild);
        }
        
        // 1. Create timestamp string
        const now = new Date();
        const options = { 
            year: 'numeric', month: 'short', day: 'numeric', 
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: true 
        };
        const dateTimeStr = now.toLocaleString('en-US', options);
        
        // 2. Show timestamp inside the capture area
        stamp.innerText = `ထုတ်ယူသည့်အချိန် - ${dateTimeStr}`;
        stamp.style.display = 'block';

        // 3. Capture
        html2canvas(captureArea, {
            backgroundColor: "#1c1f26",
            scale: 2,
            logging: false,
            useCORS: true
        }).then(canvas => {
            const image = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.download = `Gold_Calculation_${now.getTime()}.png`;
            link.href = image;
            link.click();
        }).catch(() => {
            // If capture fails, still cleanup UI
        }).finally(() => {
            const cloned = document.getElementById('goldBannerCapture');
            if (cloned) cloned.remove();
            stamp.style.display = 'none';
        });
    }

    // --- World Gold Price banner (XAU/USD) ---
    const WORLD_GOLD_API = "https://api.gold-api.com/price/XAU";
    const TROY_OZ_TO_GRAM = 31.1034768;

    async function loadWorldGoldPrice() {
        const priceEl = document.getElementById('worldGoldPrice');
        const metaEl = document.getElementById('worldGoldUpdated');
        const btn = document.getElementById('goldRefreshBtn');

        if (!priceEl || !metaEl) return;

        try {
            if (btn) { btn.disabled = true; btn.classList.add('loading'); }
            priceEl.innerText = "Loading…";
            metaEl.innerText = "Updating…";

            const res = await fetch(WORLD_GOLD_API, { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();

            const usdPerOz = Number(data.price);
            const usdPerG = usdPerOz / TROY_OZ_TO_GRAM;

            priceEl.innerText = `$${usdPerOz.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}/oz`;
            const updatedStr = data.updatedAtReadable || "";
            metaEl.innerText = `$${usdPerG.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}/g` + (updatedStr ? ` • ${updatedStr}` : "");
        } catch (e) {
            priceEl.innerText = "Unavailable";
            metaEl.innerText = "Tap ⟳ to retry";
        } finally {
            if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
        }
    }

    // Auto-refresh every 60 seconds
    document.addEventListener('DOMContentLoaded', () => {
        loadWorldGoldPrice();
        setInterval(loadWorldGoldPrice, 60000);

        const btn = document.getElementById('goldRefreshBtn');
        if (btn) btn.addEventListener('click', loadWorldGoldPrice);
    });

</script>

</body>
</html>
